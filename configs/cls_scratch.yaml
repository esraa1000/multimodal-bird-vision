# CNN encoder trained from scratch: the baseline (src/models/scratch_cnn.py).
# Keys under model.params are passed to ScratchCNN.
defaults: [base.yaml, tracker_wandb.yaml]
task: classification
run_name: cls_scratch

tracker:
  tags: [classification, scratch]

model:
  name: scratch_cnn
  num_classes: 200
  dropout: 0.3             # before the classification head
  params:
    depth: 4               # stages: 64 -> 128 -> 256 -> 512 channels
    width: 64
    blocks_per_stage: 2
    residual: false

data:
  augment: light           # none | light | strong (compare them: the augmentation ablation)
  normalize: dataset       # dataset mean/std (computed in EDA)

train:
  epochs: 40
  lr: 1.0e-3
  warmup_epochs: 2         # a few small steps first: BatchNorm statistics settle before the full lr
  label_smoothing: 0.1     # softer targets; helps with similar-looking species
