# Shared defaults. Every other config inherits from this file with
#   defaults: base.yaml
# and only lists what it changes.

seed: 42
deterministic: false     # true = bit-exact repeatability, slower
device: auto             # auto | cpu | cuda | cuda:1 | mps
run_name: null           # null -> "<task>_<mode>"

paths:
  data_dir: data                       # local machine
  data_dir_colab: /content/data        # or /content/drive/MyDrive/cub-cache to keep it between sessions
  data_dir_kaggle: /kaggle/working/data
  output_dir: outputs

tracker:
  name: local            # noop | local | wandb

data:
  img_size: 224
  batch_size: 64
  num_workers: 2
  val_fraction: 0.1      # stratified split carved out of the official train set
  split_file: configs/data/split_seed42.json   # train/val file names (duplicates already excluded)

train:
  epochs: 30
  lr: 3.0e-4
  weight_decay: 0.05
  optimizer: adamw       # adamw | adam | sgd
  scheduler: cosine      # cosine | none
  warmup_epochs: 0       # linear warm-up from 10% of lr
  min_lr: 0.0            # floor of the cosine schedule
  label_smoothing: 0.0
  amp: true              # mixed precision on GPU
  grad_clip: null        # e.g. 1.0 to clip the gradient norm
  early_stopping_patience: 8   # null = never stop early
  max_batches: null      # limit batches per epoch (quick pipeline checks only)
  upload_checkpoint: true      # upload best.pt to the tracker at the end (turn off for tuning trials)
  progress: true         # progress bar per epoch
  resume: null           # last.pt of an interrupted run (or pass --resume)
