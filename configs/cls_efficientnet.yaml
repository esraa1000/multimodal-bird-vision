
# EfficientNet-B0 transfer learning with an MLP classification head
defaults: [base.yaml, tracker_wandb.yaml]

task: classification
run_name: cls_efficientnet_mlp_frozen

tracker:
  tags: [classification, transfer, efficientnet_b0, mlp_head]

model:
  name: timm_encoder
  num_classes: 200

  params:
    backbone: efficientnet_b0
    pretrained: true
    in_channels: 3

  freeze_backbone: true
  head_type: mlp
  head_hidden_dim: 512
  head_dropout: 0.4

data:
  augment: light
  normalize: imagenet

train:
  epochs: 25
  lr: 1.0e-3
  warmup_epochs: 2
  label_smoothing: 0.1
