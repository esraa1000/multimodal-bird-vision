# Transfer learning from ImageNet (owner: M4).
defaults: [base.yaml, tracker_wandb.yaml]
task: classification
run_name: cls_resnet50

tracker:
  tags: [classification, transfer]

model:
  name: timm_encoder
  num_classes: 200
  params:                  # passed to the "timm_encoder" class (not written yet)
    backbone: resnet50
    pretrained: true
  freeze_backbone: false   # true = linear probe (only the head trains)
  backbone_lr_mult: 0.1    # smaller LR for pretrained layers when fine-tuning

data:
  augment: light
  normalize: imagenet

train:
  epochs: 25
  lr: 1.0e-3
