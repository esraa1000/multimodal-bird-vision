# ResNet-50 transfer learning: frozen ImageNet encoder, trainable linear head.
defaults: [base.yaml, tracker_wandb.yaml]
task: classification
run_name: cls_resnet50_frozen

tracker:
  tags: [classification, transfer, resnet50, frozen_encoder, linear_head]

model:
  name: timm_encoder
  num_classes: 200
  params:                  # passed to TimmEncoder
    backbone: resnet50
    pretrained: true
  freeze_backbone: true    # only the new 200-class head trains
  head_type: linear
  backbone_lr_mult: 0.1    # smaller LR for pretrained layers when fine-tuning

data:
  img_size: 224
  batch_size: 16
  augment: light
  normalize: imagenet

train:
  epochs: 25
  lr: 1.0e-3
